<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Project Docs 설정</title>
    <style nonce="__CSP_NONCE__">
      :root {
        color-scheme: light;
        font-family:
          Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #171717;
        background: #f4f1eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d8d2c8;
        border-radius: 18px;
        box-shadow: 0 20px 55px rgb(35 30 20 / 10%);
        overflow: hidden;
      }

      header {
        padding: 28px 30px 22px;
        border-bottom: 1px solid #e8e3da;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 5vw, 34px);
        letter-spacing: -0.035em;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 17px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #5b554d;
      }

      section {
        padding: 24px 30px;
        border-bottom: 1px solid #eee9e1;
      }

      dl {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 9px 16px;
        margin: 0;
      }

      dt {
        color: #756e64;
      }

      dd {
        margin: 0;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      ul {
        margin: 0;
        padding-left: 22px;
      }

      li + li {
        margin-top: 6px;
      }

      label {
        display: block;
        margin-bottom: 18px;
        font-weight: 700;
      }

      label span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.5;
        color: #746d63;
      }

      input[type="password"],
      input[type="url"],
      input[type="text"] {
        width: 100%;
        margin-top: 8px;
        padding: 13px 14px;
        border: 1px solid #bdb5aa;
        border-radius: 10px;
        background: #fff;
        color: #171717;
        font: inherit;
      }

      input:focus {
        border-color: #171717;
        outline: 3px solid rgb(23 23 23 / 12%);
      }

      .acknowledgement {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 10px;
        align-items: start;
        padding: 14px;
        border-radius: 10px;
        background: #f6f3ee;
        font-weight: 500;
      }

      .acknowledgement input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 24px 30px 30px;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid #171717;
        border-radius: 10px;
        background: #171717;
        color: #fff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button.secondary {
        background: #fff;
        color: #171717;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #status {
        flex-basis: 100%;
        min-height: 24px;
        padding-top: 4px;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      #status[data-kind="error"] {
        color: #a11c1c;
      }

      #status[data-kind="success"] {
        color: #176b36;
      }

      #result {
        display: none;
        padding: 20px;
        border-radius: 12px;
        background: #edf8f0;
      }

      #result.visible {
        display: block;
      }

      #result-warning {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid #d8a928;
        border-radius: 10px;
        background: #fff8df;
        color: #6f4b00;
      }

      #result-warning.visible {
        display: block;
      }

      a {
        color: #1b5dab;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #eeeae3;
      }

      @media (max-width: 600px) {
        body {
          padding: 0;
        }

        main {
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        header,
        section,
        .actions {
          padding-left: 20px;
          padding-right: 20px;
        }

        dl {
          grid-template-columns: 1fr;
          gap: 3px;
        }

        dd + dt {
          margin-top: 9px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Notion Project Docs 설정</h1>
        <p>
          최초 연결에서 토큰을 한 번 입력하면 이 기기의 사용자 설정에 보관되어 다른 저장소에서도
          자동으로 사용됩니다. 부모 페이지 URL은 실행할 때 바꿀 수 있고, 비워 두면 마지막으로
          성공한 주소를 사용합니다. 선택하면 검증된 Git 문서 본문도 즉시 게시합니다.
        </p>
      </header>

      <section aria-labelledby="target-heading">
        <h2 id="target-heading">설정 대상</h2>
        <dl>
          <dt>저장소</dt>
          <dd id="target"></dd>
          <dt>기준 브랜치</dt>
          <dd id="branch"></dd>
          <dt>게시 방식</dt>
          <dd id="mode"></dd>
          <dt>GitHub Environment</dt>
          <dd id="environment"></dd>
        </dl>
      </section>

      <section aria-labelledby="documents-heading">
        <h2 id="documents-heading">생성할 전용 미러 페이지</h2>
        <ul id="documents"></ul>
      </section>

      <form id="setup-form">
        <section aria-labelledby="credentials-heading">
          <h2 id="credentials-heading">Notion 연결</h2>
          <label>
            Notion integration token
            <input
              id="notion-token"
              name="notionToken"
              type="password"
              autocomplete="new-password"
              maxlength="512"
              required
              spellcheck="false"
            />
            <span id="token-help">
              최초 성공 후 기기 전용 사용자 설정 파일에 저장됩니다. 새 토큰을 입력하면 성공 후
              기존 값을 교체합니다.
            </span>
          </label>

          <label>
            Integration에 연결한 부모 페이지 URL
            <input
              id="parent-page"
              name="parentPage"
              type="url"
              autocomplete="off"
              maxlength="2048"
              placeholder="https://www.notion.so/..."
              required
              spellcheck="false"
            />
            <span id="parent-page-help">
              Wizard가 이 페이지 아래에 문서별 전용 미러 페이지를 생성합니다. 비워 두면 마지막으로
              성공한 부모 페이지 주소를 사용합니다.
            </span>
          </label>

          <label class="acknowledgement">
            <input
              id="publish-initial-content"
              name="publishInitialContent"
              type="checkbox"
              checked
            />
            <span>
              연결 직후 설정된 문서 본문을 전용 미러 페이지에 최초 1회 게시합니다. 현재
              체크아웃이 기준 브랜치여야 하며, 설정과 문서는 Git에 커밋되어 있고 검증을
              통과해야 하며 GitHub의 현재 기준 브랜치와 같은 커밋이어야 합니다. 이후
              변경은 기존 GitHub Actions 게시 정책을 따릅니다.
            </span>
          </label>

          <label class="acknowledgement">
            <input id="acknowledge" name="acknowledge" type="checkbox" required />
            <span>
              전용 GitHub Environment의 reviewer와 배포 브랜치 정책을 현재 설정에 맞게 구성하고,
              기존의 다른 배포 브랜치 정책은 제거하는 데 동의합니다. 현재 요금제가 required
              reviewer를 지원하지 않으면 reviewer 없이 구성되며 완료 화면에 경고가 표시됩니다.
            </span>
          </label>
        </section>

        <div class="actions">
          <button id="submit-button" type="submit">연결 및 페이지 생성</button>
          <button id="login-button" class="secondary" type="button">GitHub 로그인/갱신</button>
          <div id="status" role="status" aria-live="polite"></div>
        </div>
      </form>

      <section id="result" aria-labelledby="result-heading">
        <h2 id="result-heading">설정 완료</h2>
        <p id="result-summary"></p>
        <p id="result-warning" role="alert"></p>
        <ul id="result-pages"></ul>
      </section>
    </main>

    <script nonce="__CSP_NONCE__">
      const bootstrap = __BOOTSTRAP_JSON__;
      const form = document.querySelector("#setup-form");
      const submitButton = document.querySelector("#submit-button");
      const loginButton = document.querySelector("#login-button");
      const status = document.querySelector("#status");
      const tokenInput = document.querySelector("#notion-token");
      const tokenHelp = document.querySelector("#token-help");
      const parentPageInput = document.querySelector("#parent-page");
      const publishInitialContentInput = document.querySelector(
        "#publish-initial-content",
      );

      if (bootstrap.connectionDefaults.hasStoredNotionToken) {
        tokenInput.required = false;
        tokenInput.placeholder = "저장된 토큰 사용 (변경하려면 새 토큰 입력)";
        tokenHelp.textContent =
          "이 기기에 저장된 토큰을 자동으로 사용합니다. 새 토큰을 입력하면 성공 후 기존 값을 교체합니다.";
      }
      if (bootstrap.connectionDefaults.lastParentPage) {
        parentPageInput.value = bootstrap.connectionDefaults.lastParentPage;
        parentPageInput.required = false;
      }

      document.querySelector("#target").textContent = bootstrap.target;
      document.querySelector("#branch").textContent = bootstrap.canonicalBranch;
      document.querySelector("#mode").textContent = bootstrap.publicationMode;
      document.querySelector("#environment").textContent = bootstrap.environmentName;
      for (const configuredDocument of bootstrap.documents) {
        const item = document.createElement("li");
        item.textContent = `${configuredDocument.label} (${configuredDocument.key})`;
        document.querySelector("#documents").append(item);
      }

      function setBusy(busy) {
        submitButton.disabled = busy;
        loginButton.disabled = busy;
      }

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.dataset.kind = kind;
      }

      async function post(path, payload = {}) {
        const response = await fetch(path, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
          cache: "no-store",
          credentials: "omit",
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `요청 실패 (${response.status})`);
        return result;
      }

      loginButton.addEventListener("click", async () => {
        setBusy(true);
        setStatus(
          "GitHub 일회용 코드가 클립보드에 복사되고 인증 창이 열립니다. 인증이 끝날 때까지 이 화면을 닫지 마세요.",
        );
        try {
          const result = await post("github-login");
          setStatus(`${result.login} 계정으로 GitHub 인증을 확인했습니다.`, "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          setBusy(false);
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setBusy(true);
        setStatus(
          publishInitialContentInput.checked
            ? "GitHub와 Notion을 설정하고 검증된 문서 본문을 게시하는 중입니다."
            : "GitHub와 Notion 접근권한을 검증하고 설정하는 중입니다.",
        );
        document.querySelector("#result").classList.remove("visible");

        const payload = {
          notionToken: tokenInput.value,
          parentPage: parentPageInput.value,
          publishInitialContent: publishInitialContentInput.checked,
          acknowledgePolicyReplacement: document.querySelector("#acknowledge").checked,
        };

        try {
          const result = await post("setup", payload);
          setStatus("설정이 완료됐습니다. 이 창은 잠시 후 연결이 종료됩니다.", "success");
          document.querySelector("#result-summary").textContent =
            `${result.github.nameWithOwner}의 ${result.environment.environmentName} Environment에 ` +
            `${result.secrets.secretNames.join(", ")}을 등록했습니다. ` +
            (result.publication.status === "published"
              ? `${result.publication.documents.length}개 문서의 본문을 커밋 ` +
                `${result.publication.sourceSha.slice(0, 12)} 기준으로 게시했습니다.`
              : "초기 본문 게시는 선택하지 않았습니다.");
          const resultWarning = document.querySelector("#result-warning");
          resultWarning.classList.remove("visible");
          resultWarning.textContent = "";
          const warnings = [];
          if (result.environment.reviewerProtection === "unsupported-by-plan") {
            warnings.push(
              "현재 GitHub 요금제에서는 이 저장소의 required reviewer를 지원하지 않아 " +
              "reviewer 없이 구성했습니다. 수동 발행은 정확한 PUBLISH 확인을 계속 요구하지만 " +
              "별도의 Environment 승인 단계는 없습니다.",
            );
          }
          if (result.localDefaults && !result.localDefaults.saved) {
            warnings.push(result.localDefaults.warning);
          }
          if (warnings.length > 0) {
            resultWarning.textContent = warnings.join("\n\n");
            resultWarning.classList.add("visible");
          }
          const pageList = document.querySelector("#result-pages");
          pageList.replaceChildren();
          for (const page of result.notion.pages) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = page.pageUrl;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.textContent = page.label;
            item.append(link);
            pageList.append(item);
          }
          document.querySelector("#result").classList.add("visible");
          form.reset();
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          tokenInput.value = "";
          payload.notionToken = "";
          setBusy(false);
        }
      });
    </script>
  </body>
</html>
